<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Gaiden - Rework</title>
    <link rel="icon" type="image/x-icon" href="./resources/images/favicon.ico" />
    <link rel="stylesheet" href="./resources/css/theme.css" />
    <link rel="stylesheet" href="./resources/css/common.css" />
</head>
<body>
    <div id="app">
        <aside id="sidebar-nav">
            <div class="sidebar-header">
                <h1 class="app-title">Gaming Gaiden</h1>
            </div>
            <nav class="sidebar-menu">
                <a href="#summary" class="nav-link" data-route="#summary">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Summary</span>
                </a>
                <a href="#all-games" class="nav-link" data-route="#all-games">
                    <span class="nav-icon">🎮</span>
                    <span class="nav-label">All Games</span>
                    <span class="nav-badge games-count" id="sidebar-games-count">0</span>
                </a>
                <a href="#gaming-time" class="nav-link" data-route="#gaming-time">
                    <span class="nav-icon">⏱️</span>
                    <span class="nav-label">Gaming Time</span>
                </a>
                <a href="#session-history" class="nav-link" data-route="#session-history">
                    <span class="nav-icon">📅</span>
                    <span class="nav-label">Sessions</span>
                </a>
            </nav>
        </aside>
        <main id="main-content">
            <!-- Content will be rendered here -->
            <div id="view-container">Loading...</div>
            <!-- Dummy anchors to satisfy IDE navigation checks -->
            <div style="display:none">
                <div id="summary"></div>
                <div id="all-games"></div>
                <div id="gaming-time"></div>
                <div id="session-history"></div>
            </div>
        </main>
    </div>

    <script src="./resources/data.js"></script>
    <script src="./resources/route.js"></script>
    <script src="./resources/js/app.js"></script>
</body>
</html>
