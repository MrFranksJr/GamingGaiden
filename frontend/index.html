<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Gaiden</title>
    <link rel="icon" type="image/x-icon" href="./resources/images/favicon.ico" />
    <link rel="stylesheet" href="./resources/fontawesome/css/all.min.css"/>
    <link rel="stylesheet" href="./resources/css/theme.css" />
    <link rel="stylesheet" href="./resources/css/common.css" />
</head>
<body>
    <div id="app">
        <aside id="sidebar-nav">
            <div class="sidebar-header">
                <img src="./resources/images/favicon.ico" alt="Gaming Gaiden Logo" class="app-logo"/>
                <h1 class="app-title">Gaming Gaiden</h1>
                <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Toggle navigation sidebar"
                        aria-expanded="true" title="Collapse sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
            <nav class="sidebar-menu" id="sidebar-menu">
                <div class="nav-indicator" id="nav-indicator"></div>
                <a href="#summary" class="nav-link" data-route="#summary" title="Summary Dashboard">
                    <span class="nav-icon"><i class="fa-solid fa-clipboard-list"></i></span>
                    <span class="nav-label">Summary</span>
                </a>
                <a href="#all-games" class="nav-link" data-route="#all-games" title="All Games">
                    <span class="nav-icon"><i class="fa-solid fa-gamepad"></i></span>
                    <span class="nav-label">All Games</span>
                    <span class="nav-badge games-count" id="sidebar-games-count">0</span>
                </a>
                <a href="#gaming-time" class="nav-link" data-route="#gaming-time" title="Gaming Time">
                    <span class="nav-icon"><i class="fa-solid fa-stopwatch"></i></span>
                    <span class="nav-label">Gaming Time</span>
                </a>
                <a href="#session-history" class="nav-link" data-route="#session-history" title="Session History">
                    <span class="nav-icon"><i class="fa-solid fa-calendar"></i></span>
                    <span class="nav-label">Sessions</span>
                </a>
            </nav>
            <div class="sidebar-footer" id="sidebar-footer">
                <div class="theme-switcher" id="theme-switcher" title="Change theme (System / Dark / Light)">
                    <div class="theme-switcher-icon">
                        <i class="fa-solid fa-desktop" id="theme-icon" aria-hidden="true"></i>
                    </div>
                    <label for="theme-select" class="visually-hidden">Theme Preference</label>
                    <div class="theme-select-wrapper">
                        <select id="theme-select" class="theme-select" aria-label="Select color theme">
                            <option value="system">System</option>
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                        </select>
                        <i class="fa-solid fa-chevron-down theme-select-arrow" aria-hidden="true"></i>
                    </div>
                </div>
            </div>
        </aside>
        <main id="main-content">
            <!-- Content will be rendered here -->
            <div id="view-container">Loading...</div>
            <!-- Dummy anchors to satisfy IDE navigation checks -->
            <div style="display:none">
                <div id="summary"></div>
                <div id="all-games"></div>
                <div id="gaming-time"></div>
                <div id="session-history"></div>
            </div>
        </main>
    </div>

    <script src="./resources/data.js"></script>
    <script src="./resources/route.js"></script>
    <script src="./resources/js/app.js"></script>
</body>
</html>
